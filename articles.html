<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <title>All Articles - Best Toilet Seats</title>
  <meta name="description" content="Browse all toilet seat reviews, buying guides, and comparisons. Find the perfect toilet seat for your bathroom.">
  <meta property="og:title" content="All Articles - Best Toilet Seats">
  <meta property="og:description" content="Browse all our expert toilet seat reviews, guides, and comparisons.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://besttoiletseats.com/articles">
  <link rel="canonical" href="https://besttoiletseats.com/articles">
  <script src="components/site-config.js?v=5"></script>
  <link rel="preload" href="articles.json?v=2" as="fetch" crossorigin>
  <style>
    :root {
      --primary: #1565C0;
      --primary-light: #42A5F5;
      --primary-dark: #0D47A1;
      --accent: #FFB300;
      --accent-dark: #FF8F00;
      --bg-light: #FAFAFA;
      --bg-warm: #F3F8FF;
      --text: #222222;
      --text-light: #666666;
      --border: #DDEAF9;
      --white: #FFFFFF;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      line-height: 1.65;
      color: var(--text);
      background: var(--white);
    }

    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* ─── HERO ─── */
    .hero {
      background: var(--bg-warm);
      border-bottom: 1px solid var(--border);
      padding: 3rem 0 2.5rem;
    }

    .hero-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--primary-light);
      margin-bottom: .5rem;
    }

    .hero h1 {
      font-size: 2rem;
      font-weight: normal;
      line-height: 1.3;
      color: var(--text);
      margin-bottom: .5rem;
    }

    .hero p {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: .9375rem;
      color: var(--text-light);
    }

    /* ─── FILTERS ─── */
    .filter-row {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      margin: 2rem 0 1.5rem;
    }

    .filter-btn {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: .8125rem;
      font-weight: 600;
      padding: .4rem 1rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--white);
      color: var(--text-light);
      cursor: pointer;
      transition: all .15s ease;
    }
    .filter-btn:hover {
      border-color: var(--primary-light);
      color: var(--primary);
    }
    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--white);
    }

    /* ─── STATS ─── */
    .stats-bar {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: .8125rem;
      color: var(--text-light);
      margin-bottom: 1.5rem;
    }

    /* ─── ARTICLES GRID ─── */
    .articles-grid {
      display: grid;
      gap: 1.25rem;
    }

    .article-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .article-card:hover {
      border-color: var(--primary-light);
      box-shadow: 0 2px 12px rgba(21,101,192,.08);
    }

    .article-card a { text-decoration: none; color: inherit; }

    .article-card img {
      width: 100%;
      height: auto;
      aspect-ratio: 16/7;
      object-fit: cover;
      display: block;
    }

    .article-card-body {
      padding: 1.1rem 1.25rem 1.25rem;
    }

    .article-card-meta {
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: .5rem;
    }

    .tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: .625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      padding: .2rem .5rem;
      border-radius: 2px;
    }
    .tag-reviews     { background: #FFF3E0; color: #BF360C; }
    .tag-guides      { background: #E3F2FD; color: #0D47A1; }
    .tag-comparisons { background: #E8F5E9; color: #2E7D32; }

    .article-card-date {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: .75rem;
      color: #999;
    }

    .article-card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: .4rem;
    }

    .article-card-title a {
      color: var(--primary-dark);
      text-decoration: none;
    }
    .article-card-title a:hover { color: var(--accent); }

    .article-card-summary {
      font-size: .875rem;
      color: var(--text-light);
      line-height: 1.55;
      margin-bottom: .85rem;
    }

    .read-more {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: .8125rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }
    .read-more:hover { text-decoration: underline; }

    /* ─── NEWSLETTER ─── */
    .newsletter-section {
      background: var(--bg-warm);
      border-top: 1px solid var(--border);
      padding: 3rem 0;
      margin-top: 3rem;
    }

    .newsletter-inner {
      max-width: 480px;
      margin: 0 auto;
      text-align: center;
    }

    .newsletter-inner h3 {
      font-size: 1.25rem;
      font-weight: normal;
      color: var(--text);
      margin-bottom: .5rem;
    }

    .newsletter-inner p {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: .875rem;
      color: var(--text-light);
      margin-bottom: 1.25rem;
    }

    .newsletter-form {
      display: flex;
      gap: .5rem;
    }

    .newsletter-form input {
      flex: 1;
      padding: .65rem 1rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: .9rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .newsletter-form input:focus {
      outline: none;
      border-color: var(--primary-light);
    }

    .newsletter-form button {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: .65rem 1.25rem;
      background: var(--accent);
      color: var(--white);
      border: none;
      border-radius: 3px;
      font-weight: 600;
      font-size: .875rem;
      cursor: pointer;
      transition: background .2s ease;
    }
    .newsletter-form button:hover { background: var(--accent-dark); }

    .no-results {
      text-align: center;
      padding: 3rem;
      color: var(--text-light);
      grid-column: 1 / -1;
    }

    /* ─── RESPONSIVE ─── */
    @media (min-width: 640px) {
      .articles-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (min-width: 960px) {
      .articles-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    @media (max-width: 639px) {
      .hero h1 { font-size: 1.5rem; }
      .newsletter-form { flex-direction: column; }
    }
  </style>
    <link rel="stylesheet" href="components/wirecutter-standard.css?v=20260425">
</head>
<body>
  <header id="site-header"></header>

  <section class="hero">
    <div class="container">
      <div class="hero-label">Browse</div>
      <h1>All Articles</h1>
      <p>Expert reviews, buying guides, and comparisons for toilet seats</p>
    </div>
  </section>

  <main class="container" style="padding-top: 0; padding-bottom: 2rem;">
    <div class="filter-row">
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="Reviews">Reviews</button>
      <button class="filter-btn" data-category="Guides">Guides</button>
      <button class="filter-btn" data-category="Comparisons">Comparisons</button>
    </div>

    <div class="stats-bar">
      <span id="results-count">Loading articles...</span>
    </div>

    <div class="articles-grid" id="articles-grid">
      <div class="no-results">Loading articles...</div>
    </div>
  </main>

  <section class="newsletter-section">
    <div class="container">
      <div class="newsletter-inner">
        <h3>Get new articles in your inbox</h3>
        <p>Join readers who get our weekly toilet seat reviews and buying tips.</p>
        <form class="newsletter-form" onsubmit="handleNewsletter(event)">
          <input type="email" placeholder="Enter your email" required>
          <button type="submit">Subscribe</button>
        </form>
      </div>
    </div>
  </section>

  <footer id="site-footer"></footer>
  <script src="components/site-components.js?v=5"></script>
  <script>
    let allArticles = [];

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d)) return '';
      return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
    }

    function renderArticles(category) {
      const grid = document.getElementById('articles-grid');
      const filtered = category === 'all'
        ? allArticles
        : allArticles.filter(a => a.category === category);

      document.getElementById('results-count').textContent =
        filtered.length + ' article' + (filtered.length !== 1 ? 's' : '') +
        (category !== 'all' ? ' in ' + category : '');

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-results"><p>No articles found in this category.</p></div>';
        return;
      }

      grid.innerHTML = filtered.map(function(article) {
        var tagClass = 'tag-' + (article.category || '').toLowerCase().replace(/\s+/g, '-');
        var dateStr = formatDate(article.publishDate);
        return '<article class="article-card">' +
          '<a href="' + article.slug + '">' +
            '<img src="' + (article.image || 'images/hero-best-toilet-seats.webp') + '" alt="' + article.title + '" loading="lazy" onerror="this.onerror=null;this.src=\'images/hero-best-toilet-seats.webp\'">' +
          '</a>' +
          '<div class="article-card-body">' +
            '<div class="article-card-meta">' +
              '<span class="tag ' + tagClass + '">' + (article.category || '') + '</span>' +
              (dateStr ? '<span class="article-card-date">' + dateStr + '</span>' : '') +
            '</div>' +
            '<div class="article-card-title"><a href="' + article.slug + '">' + article.title + '</a></div>' +
            '<p class="article-card-summary">' + (article.summary || '') + '</p>' +
            '<a href="' + article.slug + '" class="read-more">Read article &rarr;</a>' +
          '</div>' +
        '</article>';
      }).join('');
    }

    function setupFilters() {
      document.querySelectorAll('.filter-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
          this.classList.add('active');
          renderArticles(this.dataset.category);
        });
      });
    }

    function handleNewsletter(e) {
      e.preventDefault();
      const input = e.target.querySelector('input');
      const email = input.value;
      input.value = '';
      e.target.innerHTML = '<p style="color: var(--primary); font-weight: 600;">Thanks! We\'ll be in touch.</p>';
    }

    fetch('articles.json?v=2')
      .then(function(r) { return r.json(); })
      .then(function(articles) {
        articles.sort(function(a, b) { return new Date(b.publishDate) - new Date(a.publishDate); });
        allArticles = articles;
        renderArticles('all');
        setupFilters();
      })
      .catch(function() {
        document.getElementById('articles-grid').innerHTML = '<div class="no-results"><p>No articles yet. Check back soon!</p></div>';
        document.getElementById('results-count').textContent = '0 articles';
      });
  </script>
</body>
</html>
